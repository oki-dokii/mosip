services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: playground
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
    ports:
      - "127.0.0.1:${PLAYGROUND_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playground -d playground"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - playground-postgres:/var/lib/postgresql/data

  bff:
    profiles: [core]
    build:
      context: .
      target: bff
    environment:
      DATABASE_URL: postgresql://playground:playground@postgres:5432/playground?schema=public
      PORT: 4000
      WEB_ORIGIN: http://localhost:${PLAYGROUND_WEB_PORT:-5174}
      PLAYGROUND_DRIVER_MODE: ${PLAYGROUND_DRIVER_MODE:-fixture}
      MOCK_ISSUER_BASE_URL: ${MOCK_ISSUER_BASE_URL:-}
      MOCK_VERIFIER_BASE_URL: ${MOCK_VERIFIER_BASE_URL:-}
      MOCK_ISSUER_ENABLE_TEST_CASES: ${MOCK_ISSUER_ENABLE_TEST_CASES:-false}
      VERIFY_BASE_URL: ${VERIFY_BASE_URL:-https://injiverify.collab.mosip.net/v1/verify}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    profiles: [core]
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${PLAYGROUND_WEB_PORT:-5174}:80"
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-issuer:
    profiles: [mocks]
    build:
      context: .
      target: mock-issuer
    environment:
      MOCK_ISSUER_HOST: 0.0.0.0
      MOCK_ISSUER_PUBLIC_URL: http://mock-issuer:4101
      MOCK_ISSUER_ENABLE_TEST_CASES: ${MOCK_ISSUER_ENABLE_TEST_CASES:-false}
    networks:
      - default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4101/.well-known/openid-credential-issuer').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-verifier:
    profiles: [mocks]
    build:
      context: .
      target: mock-verifier
    environment:
      MOCK_VERIFIER_HOST: 0.0.0.0
      MOCK_VERIFIER_PUBLIC_URL: http://mock-verifier:4102
    networks:
      - default
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(4102,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  playground-postgres:
