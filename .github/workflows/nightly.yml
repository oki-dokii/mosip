name: Nightly compatibility checks

# Fresh mock cases and a public subset of local official-service controls.
# Historical Collab records are not fresh nightly observations.
on:
  schedule:
    # 02:00 UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-mock-regression
  cancel-in-progress: false

jobs:

  nightly-mock-smoke:
    name: Nightly mock smoke (mock/fixture only)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set OCI build labels
        run: |
          echo "GIT_REVISION=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build and start Compose stack (core + mocks)
        env:
          PLAYGROUND_DRIVER_MODE: collab
          MOCK_ISSUER_BASE_URL: http://mock-issuer:4101
          MOCK_VERIFIER_BASE_URL: http://mock-verifier:4102
          MOCK_ISSUER_ENABLE_TEST_CASES: "true"
        run: |
          docker compose --profile core --profile mocks up --build -d --wait

      - name: Show container status
        run: docker compose --profile core --profile mocks ps

      - name: Run e2e smoke
        env:
          E2E_BFF_URL: http://127.0.0.1:4000
          E2E_WEB_URL: http://127.0.0.1:5174
          E2E_DRIVER_MODE: collab
          E2E_STORAGE: postgres
          E2E_TIMEOUT_MS: "60000"
        run: node e2e/smoke.mjs

      - name: Export six-case mock matrix
        env:
          MATRIX_ARTIFACT_PATH: artifacts/mock-matrix.json
          MOCK_ISSUER_ENABLE_TEST_CASES: "true"
        run: node scripts/compose-smoke.mjs

      - name: Upload mock matrix artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-mock-matrix-${{ github.run_number }}
          path: artifacts/mock-matrix.json
          if-no-files-found: ignore

      - name: Collect container logs (always)
        if: always()
        run: |
          docker compose --profile core --profile mocks logs --no-color --tail=300 \
            > /tmp/nightly-logs.txt 2>&1 || true

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-compose-logs-${{ github.run_number }}
          path: /tmp/nightly-logs.txt

      - name: Stop and remove containers and volumes (always)
        if: always()
        run: docker compose --profile core --profile mocks down -v

  protocol-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@11.25.0 && pnpm install --frozen-lockfile
      - run: pnpm build
      - run: mkdir -p nightly
      - name: Run isolated SD-JWT protocol controls
        run: node spikes/wallet-interop-local.mjs --out nightly/sd.json
      - name: Run JSON-LD controls
        if: '!cancelled()'
        run: node spikes/jsonld-interop-probes.mjs --out nightly/ld.json
      - name: Join fresh protocol records with dated Inji observations
        if: '!cancelled()'
        run: node scripts/protocol-matrix.mjs nightly/sd.json nightly/ld.json nightly/matrix.json
      - uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: protocol-matrix-${{ github.run_number }}
          path: nightly/
          if-no-files-found: error

  official-local-control:
    name: Local Certify and Verify (reference holder)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@11.25.0 && pnpm install --frozen-lockfile
      - name: Start official services and require a valid control
        run: pnpm demo:inji
      - name: Record current local compatibility results
        run: |
          mkdir -p reports
          node scripts/local-inji-smoke.mjs --public-matrix > "reports/$(date -u +%F)-local-inji.json"
      - name: Preserve observed outcomes even when a negative case unexpectedly passes
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: local-inji-compatibility-${{ github.run_id }}
          path: reports/*.json
          if-no-files-found: error
